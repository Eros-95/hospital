<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就诊记录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #eaf7ec 0%, #d8f0dc 50%, #eaf7ec 100%);
    min-height: 100vh;
    padding: 40px 16px;
    color: #2b3a4a;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .card {
    background: #fff; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(76, 175, 80, 0.15); overflow: hidden;
    margin-bottom: 24px;
  }
  .header {
    background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
    padding: 22px 28px; color: #fff;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
  .header p { margin-top: 4px; font-size: 13px; opacity: 0.9; }
  .body { padding: 24px 28px; }
  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; }
  .toolbar input { flex: 1; }
  input, select {
    padding: 10px 12px; font-size: 14px; color: #2b3a4a;
    border: 1px solid #c9e6cb; border-radius: 8px; background: #f7fbf7;
    outline: none; font-family: inherit; transition: all 0.2s ease;
  }
  input:focus, select:focus { border-color: #66bb6a; background: #fff; box-shadow: 0 0 0 3px rgba(102,187,106,0.15); }
  .btn {
    display: inline-block; padding: 11px 20px; font-size: 15px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%); border: none; border-radius: 8px;
    cursor: pointer; letter-spacing: 1px; transition: all 0.2s ease; white-space: nowrap;
  }
  .btn:hover { box-shadow: 0 6px 16px rgba(67,160,71,0.35); transform: translateY(-1px); }
  .btn.plain { background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.6); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eef3ee; }
  th { background: #f2faf3; color: #3f6b45; font-weight: 600; }
  tbody tr { cursor: pointer; transition: background 0.15s ease; }
  tbody tr:hover { background: #f4fbf5; }
  .link-btn { color: #43a047; cursor: pointer; border: none; background: none; font-size: 14px; }
  .link-btn:hover { text-decoration: underline; }
  .empty { text-align: center; color: #9aa; padding: 24px 0; }
  .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; display: none; }
  .msg.err { display: block; background: #fdecea; color: #c62828; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; font-size: 12px; }
  .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; }
  .pagination .page-btn {
    padding: 7px 14px; font-size: 14px; color: #43a047; background: #fff;
    border: 1px solid #c9e6cb; border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
  }
  .pagination .page-btn:hover:not(:disabled) { background: #e8f5e9; }
  .pagination .page-btn:disabled { color: #bbb; cursor: not-allowed; }
  .pagination .page-info { font-size: 14px; color: #667; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="header">
      <div>
        <h1>就诊记录</h1>
        <p>查询门诊就诊记录，点击行查看详情</p>
      </div>
      <button class="btn plain" onclick="location.href='visit_edit.html'">新增就诊记录</button>
    </div>
    <div class="body">
      <div class="msg" id="msg"></div>
      <div class="toolbar">
        <input type="text" id="keyword" placeholder="搜索患者姓名 / 诊断 / 科室" oninput="searchVisits()">
        <button class="btn" onclick="searchVisits()">查询</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>患者姓名</th><th>科室</th><th>诊断</th><th>就诊时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">暂无就诊记录</div>
      <div class="pagination" id="pagination" style="display:none">
        <button class="page-btn" id="prevBtn" onclick="goToPage(currentPage - 1)">上一页</button>
        <span class="page-info" id="pageInfo"></span>
        <button class="page-btn" id="nextBtn" onclick="goToPage(currentPage + 1)">下一页</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = (location.protocol === 'file:') ? 'http://127.0.0.1:8000' : '';
const PAGE_SIZE = 10;
let currentPage = 1;

function showMsg(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg err';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function formatTime(t) {
  if (!t) return '';
  return t.replace('T', ' ');
}

function goToPage(page) {
  currentPage = page;
  loadVisits();
}

function searchVisits() {
  currentPage = 1;
  loadVisits();
}

function loadVisits() {
  const keyword = document.getElementById('keyword').value.trim();
  const params = new URLSearchParams({ page: currentPage, page_size: PAGE_SIZE });
  if (keyword) params.set('keyword', keyword);
  fetch(API_BASE + '/api/visits?' + params.toString())
    .then(res => res.json())
    .then(data => {
      const tbody = document.getElementById('tbody');
      const empty = document.getElementById('empty');
      const pagination = document.getElementById('pagination');
      tbody.innerHTML = '';
      const items = data.items || [];
      if (items.length === 0) { empty.style.display = 'block'; pagination.style.display = 'none'; return; }
      empty.style.display = 'none';
      items.forEach(v => {
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + escapeHtml(v.patient_name) + '</td>' +
          '<td><span class="tag">' + escapeHtml(v.department) + '</span></td>' +
          '<td>' + escapeHtml(v.diagnosis) + '</td>' +
          '<td>' + escapeHtml(formatTime(v.visit_time)) + '</td>' +
          '<td><button class="link-btn" onclick="event.stopPropagation(); location.href=\'visit_detail.html?id=' + v.id + '\'">详情</button></td>';
        tr.onclick = () => location.href = 'visit_detail.html?id=' + v.id;
        tbody.appendChild(tr);
      });
      renderPagination(data);
    })
    .catch(() => showMsg('加载失败，请确认后端已启动'));
}

function renderPagination(data) {
  const total = data.total || 0;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const pagination = document.getElementById('pagination');
  pagination.style.display = 'block';
  document.getElementById('pageInfo').textContent = '第 ' + currentPage + ' / ' + totalPages + ' 页（共 ' + total + ' 条）';
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= totalPages;
}

loadVisits();
</script>
</body>
</html>
