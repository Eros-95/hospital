<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就诊记录详情</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #eaf7ec 0%, #d8f0dc 50%, #eaf7ec 100%);
    min-height: 100vh;
    padding: 40px 16px;
    color: #2b3a4a;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .card {
    background: #fff; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(76, 175, 80, 0.15); overflow: hidden;
    margin-bottom: 24px;
  }
  .header {
    background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
    padding: 22px 28px; color: #fff;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
  .header p { margin-top: 4px; font-size: 13px; opacity: 0.9; }
  .body { padding: 24px 28px; }
  .section-title { font-size: 14px; font-weight: 600; color: #3f6b45; margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #eef3ee; }
  .section-title:first-child { margin-top: 0; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
  .info-item label { display: block; font-size: 12px; color: #8aa; margin-bottom: 3px; }
  .info-item .value { font-size: 15px; color: #2b3a4a; word-break: break-all; }
  .info-item.full { grid-column: 1 / -1; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; font-size: 13px; }
  .btn {
    display: inline-block; padding: 11px 20px; font-size: 15px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%); border: none; border-radius: 8px;
    cursor: pointer; letter-spacing: 1px; transition: all 0.2s ease; margin-right: 10px;
  }
  .btn:hover { box-shadow: 0 6px 16px rgba(67,160,71,0.35); transform: translateY(-1px); }
  .btn.cancel { background: #9e9e9e; }
  .btn.danger { background: #e05b5b; }
  .actions { margin-top: 24px; }
  .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; display: none; }
  .msg.err { display: block; background: #fdecea; color: #c62828; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="header">
      <div>
        <h1>就诊记录详情</h1>
        <p id="subtitle"></p>
      </div>
      <button class="btn plain" style="background:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.6)" onclick="location.href='visits.html'">返回列表</button>
    </div>
    <div class="body" id="content">
      <div class="msg" id="msg"></div>
    </div>
  </div>
</div>

<script>
const API_BASE = (location.protocol === 'file:') ? 'http://127.0.0.1:8000' : '';
const params = new URLSearchParams(location.search);
const id = params.get('id');

function showMsg(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg err';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function info(label, value, full) {
  const div = document.createElement('div');
  div.className = 'info-item' + (full ? ' full' : '');
  div.innerHTML = '<label>' + escapeHtml(label) + '</label><div class="value">' + escapeHtml(value || '—') + '</div>';
  return div;
}

function render(v) {
  document.getElementById('subtitle').textContent = v.department + ' · ' + (v.visit_time || '').replace('T', ' ');

  const content = document.getElementById('content');

  const pTitle = document.createElement('div');
  pTitle.className = 'section-title';
  pTitle.textContent = '患者信息';
  content.appendChild(pTitle);
  const pGrid = document.createElement('div');
  pGrid.className = 'info-grid';
  pGrid.appendChild(info('姓名', v.patient_name));
  pGrid.appendChild(info('性别', v.patient_gender));
  pGrid.appendChild(info('年龄', v.patient_age + '岁'));
  pGrid.appendChild(info('联系电话', v.patient_phone));
  content.appendChild(pGrid);

  const vTitle = document.createElement('div');
  vTitle.className = 'section-title';
  vTitle.textContent = '就诊信息';
  content.appendChild(vTitle);
  const vGrid = document.createElement('div');
  vGrid.className = 'info-grid';
  vGrid.appendChild(info('科室', v.department));
  vGrid.appendChild(info('接诊医生', v.doctor));
  vGrid.appendChild(info('诊断', v.diagnosis));
  vGrid.appendChild(info('就诊时间', (v.visit_time || '').replace('T', ' ')));
  vGrid.appendChild(info('主诉', v.chief_complaint, true));
  vGrid.appendChild(info('处理 / 医嘱', v.treatment, true));
  content.appendChild(vGrid);

  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.innerHTML =
    '<button class="btn" onclick="location.href=\'visit_edit.html?id=' + v.id + '\'">编辑</button>' +
    '<button class="btn danger" onclick="deleteVisit()">删除</button>';
  content.appendChild(actions);
}

function deleteVisit() {
  if (!confirm('确定删除该就诊记录吗？')) return;
  fetch(API_BASE + '/api/visits/' + id, { method: 'DELETE' })
    .then(res => {
      if (res.ok) { location.href = 'visits.html'; return; }
      showMsg('删除失败');
    })
    .catch(() => showMsg('请求失败，请确认后端已启动'));
}

if (!id) {
  showMsg('缺少记录 ID');
} else {
  fetch(API_BASE + '/api/visits/' + id)
    .then(res => res.json())
    .then(v => {
      if (v.detail) { showMsg(v.detail); return; }
      render(v);
    })
    .catch(() => showMsg('加载失败，请确认后端已启动'));
}
</script>
</body>
</html>
